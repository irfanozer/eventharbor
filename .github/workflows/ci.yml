name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eventharbor_test
          POSTGRES_USER: eventharbor
          POSTGRES_PASSWORD: eventharbor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventharbor -d eventharbor_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      EVENTHARBOR_ENVIRONMENT: test
      EVENTHARBOR_DATABASE_URL: postgresql+asyncpg://eventharbor:eventharbor@localhost:5432/eventharbor_test
      EVENTHARBOR_TEST_DATABASE_URL: postgresql+asyncpg://eventharbor:eventharbor@localhost:5432/eventharbor_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e "./backend[dev]"

      - name: Lint
        run: ruff check backend

      - name: Check formatting
        run: ruff format --check backend

      - name: Type check
        working-directory: backend
        run: mypy src

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Test
        working-directory: backend
        run: pytest
